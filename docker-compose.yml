version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: spacethink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spacethink}
      POSTGRES_USER: ${POSTGRES_USER:-spacethink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spacethink_local}
    ports:
      - "5432:5432"
    volumes:
      - spacethink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spacethink}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  spacethink_pgdata:
